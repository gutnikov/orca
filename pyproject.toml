[project]
name = "orca"
version = "0.14.0"
description = ""
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13.3",
    "jinja2>=3.1.6",
    "mcp>=1.0",
    "pyyaml>=6.0.3",
    "slack-sdk>=3.33",
    "starlette>=0.41",
    "textual>=1.0",
    "uvicorn>=0.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orca"]

[tool.hatch.build.targets.wheel.force-include]
"src/orca/playbooks" = "orca/playbooks"
"web/dist" = "orca/web_dist"

[project.scripts]
orca = "orca.cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
exclude = [
    "examples/",
]

[[tool.mypy.overrides]]
module = "slack_sdk.socket_mode.*"
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.15.7",
    "textual>=1.0",
    "types-pyyaml>=6.0.12.20250915",
]
