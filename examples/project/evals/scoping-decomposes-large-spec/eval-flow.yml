# Eval workflow: scoping-decomposes-large-spec
#
# Shape: scoping -> assert.
# Body state `scoping` is copied verbatim from examples/project/orca.yml
# and references ../../prompts/scoping.md so the prompt under eval is
# exercised as-is. Both scoping outcomes route to `assert` — we're
# grading the result, not running the rest of the flow.

issue:
  fields:
    title:
      type: string
      description: "Short title for the issue"
    description:
      type: string
      description: "Detailed description of what needs to be done"
    scope_boundary:
      type: string
      description: "Files and directories this issue owns — other issues must not modify these paths"

max_hops: 5
max_worker_retries: 2

initial: scoping

states:

  scoping:
    worker:
      kind: claude-code
      prompt: ../../prompts/scoping.md
      timeout: 600
      result_format:
        outcome:
          type: enum
          values: [decompose, ready]
          description: "Whether to decompose into sub-issues or proceed to planning"
          values_description:
            decompose: "The spec is too large — break into isolated, non-overlapping sub-issues"
            ready: "Small enough for a single worker to plan and implement"
        sub_issues:
          type: list
          items: "$issue"
          required_when: [decompose]
          description: "List of sub-issues to create"
    on:
      decompose: assert
      ready: assert

  assert:
    worker:
      kind: claude-code
      prompt:
        text: |
          # Assert

          You are grading the scoping state's output against a checklist.

          1. Read `evals/{{ run.eval_name }}/assertions.md`. Each `### <id>`
             heading is one pass/fail criterion; the prose under it is the
             criterion itself.
          2. Inspect the scoping state's result file under
             `{{ run.run_dir }}/state-results/` and the current worktree.
          3. For each criterion, decide `pass`, `fail`, or `not_applicable`
             with a one-sentence reason.
          4. Write `{{ run.run_dir }}/report.md` with a Markdown table:
             `| ID | Status | Reason |`. Include a summary line with the
             overall outcome.
          5. Write `{{ result_path }}` with the overall outcome
             (`passed` if every criterion is `pass` or `not_applicable`;
             `failed` if any criterion is `fail`; `inconclusive` if you
             could not grade) plus the per-criterion list.

          ```json
          {{ result_example | tojson(indent=2) }}
          ```
      timeout: 600
      result_format:
        outcome:
          type: enum
          values: [passed, failed, inconclusive]
          description: "Overall eval outcome"
          values_description:
            passed: "Every criterion passed (or was not applicable)"
            failed: "At least one criterion failed; the slice ran and was graded"
            inconclusive: "Grading could not complete — treat result as unreliable"
        criteria:
          type: list
          items: "string"
          description: "Per-criterion grading records"
    on:
      passed: review
      failed: review
      inconclusive: review

  review:
    worker:
      kind: claude-code
      prompt:
        text: |
          # Review

          You are assembling a human-review form for an eval that just finished.
          The form is comment-driven: the user reads the assertions and the
          worktree diff, leaves inline comments where they want changes, and
          submits. The agent then drives the prompt/assertion edits step-by-step
          from those comments — there are no action checkboxes on the form.

          1. Read {{ run.run_dir }}/report.md — it has a Markdown table
             `| ID | Status | Reason |` with one row per criterion.
          2. From the current working directory (already inside the eval
             worktree), run `git diff --no-color HEAD~3..HEAD --stat` to learn
             which files the worker changed, then `git diff` per file for the
             unified hunks. If there is no diff, the worktree is unchanged and
             the changeset block's `files` list should be empty.
          3. Emit `outcome: waiting` with the form below. Fill in:
             - `criteria`: one entry per row of the report table, mapping the
               row's status text to `"passed"` / `"failed"` / `"skipped"`
               exactly. `summary` is the row's reason text (first sentence is
               fine).
             - `files`: one entry per changed file with `path`, `status`
               (`added` / `modified` / `deleted` / `renamed`), `language`
               (best-effort from extension), `additions`, `deletions`, and
               `diff` (the unified diff hunks for that file).
          4. When the user submits, you will receive a JSON envelope on stdin.
             Parse it and write {{ result_path }} with:
             - `outcome: reviewed` if the user left at least one comment;
             - `outcome: skipped` if the user submitted with no comments or
               cancelled the form.
             - `comments`: the changeset block's line-anchored comments
               as a list of `"<path>:<line> <body>"` strings (may be empty).

          Form schema (copy this exact shape into your waiting payload, with
          the placeholders filled):

          ```json
          {
            "title": "Review eval results",
            "description": "Comment inline where you want changes; submit when done.",
            "submit_label": "Submit comments",
            "cancel_label": "Skip",
            "steps": [
              {
                "blocks": [
                  {
                    "kind": "markdown",
                    "content": "<one-line summary of report.md overall outcome>"
                  },
                  {"kind": "assertions", "criteria": []},
                  {"kind": "changeset", "name": "review", "files": []}
                ]
              }
            ]
          }
          ```

          Required result shape:

          ```json
          {{ result_example | tojson(indent=2) }}
          ```
      inactivity_timeout: 3600
      result_format:
        outcome:
          type: enum
          values: [reviewed, skipped]
          description: "Did the user leave any comments?"
          values_description:
            reviewed: "User submitted with at least one comment"
            skipped: "User submitted with no comments or cancelled"
        comments:
          type: list
          items: "string"
          description: "Line-anchored comments from the changeset block, formatted '<path>:<line> <body>'"
    on:
      reviewed: done
      skipped: done
