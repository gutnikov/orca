# One-state flow used by the orca-eval-run playbook after an eval has
# finished. The state's worker reads the eval's report.md plus the worktree
# diff, then emits a 'waiting' outcome with a multi-block review form.
# Submission unblocks the worker; the playbook reads the submitted values.
#
# Drive with: orca run task.md -w eval-review --field eval=<name> --field run_id=<id>

issue:
  fields:
    title:
      type: string
      description: "Issue title (ignored — this flow is a one-shot review)"
    description:
      type: string
      description: "Issue description (ignored)"
    eval:
      type: string
      description: "Eval directory name under .orca/evals/ that just ran"
    run_id:
      type: string
      description: "Run ID whose .orca-state/eval-states/<eval>/<run_id>/ holds the worker output"

initial: review

states:

  review:
    worker:
      kind: claude-code
      prompt: prompts/eval-review.md
      timeout: 1800
      result_format:
        outcome:
          type: enum
          values: [done]
          description: "Review step completed"
        cancelled:
          type: boolean
          description: "True if the user cancelled the review form"
        diff_review:
          type: object
          description: "Submitted review comments keyed by file/line/side"
        update_prompts:
          type: boolean
          description: "User wants to update prompts"
        update_assertions:
          type: boolean
          description: "User wants to update assertions"
        commit:
          type: boolean
          description: "User wants to commit changes"
    on:
      done: done
