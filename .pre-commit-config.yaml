repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        exclude: ^(examples/|tests/)
        additional_dependencies:
          - types-PyYAML>=6.0.12
          - pytest>=9.0.2
          - jinja2>=3.0.0
          - textual>=1.0

  - repo: local
    hooks:
      - id: check-playbooks
        name: Check playbook and plugin-skill link integrity
        entry: tools/check_playbooks.py
        language: script
        files: ^(src/orca/playbooks/.*\.md|plugin/orca/skills/.*\.md|plugins/orca/skills/.*\.md|tools/check_playbooks\.py)$
        pass_filenames: false
